<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ponpon Patlat</title>
<!-- Playables SDK oyun kodundan önce yüklenmek zorunda. -->
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
:root {
  --navy: #1e2a78;
  --coral: #ff6f61;
  --turq: #2ec4c6;
  --yellow: #ffc93c;
  --yellow-deep: #e09a12;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Baloo 2", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #8ed8e8;
  font-family: var(--font);
  color: var(--navy);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* Puan ve süre */
.hud {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top));
  left: 50%;
  width: min(92vw, 460px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms var(--ease-out);
}
.hud[data-open="true"] { opacity: 1; }

.score {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 84px;
  padding: 6px 16px 6px 10px;
  border-radius: 999px;
  background: #fff;
  border: 3px solid var(--navy);
  font-size: clamp(20px, 5vmin, 30px);
  font-weight: 800;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.score-dot {
  width: 0.8em;
  height: 0.8em;
  border-radius: 50%;
  background: var(--coral);
  border: 2px solid var(--navy);
}

.timebar {
  flex: 1;
  height: 18px;
  border-radius: 999px;
  background: #fff;
  border: 3px solid var(--navy);
  overflow: hidden;
}
.timebar-fill {
  width: 100%;
  height: 100%;
  background: var(--turq);
  transform-origin: left center;
  transition: background-color 200ms ease;
}
.timebar-fill[data-low="true"] { background: var(--coral); }

/* Ekranlar */
.screen {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: scale(0.95);
  transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out), visibility 0s linear 150ms;
}
.screen[data-open="true"] {
  opacity: 1;
  visibility: visible;
  transform: scale(1);
  transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out), visibility 0s;
}

.panel {
  pointer-events: auto;
  width: min(100%, 400px);
  max-height: 100%;
  padding: clamp(16px, 4.5vmin, 30px);
  border-radius: 32px;
  background: rgba(255, 255, 255, 0.94);
  border: 4px solid var(--navy);
  text-align: center;
}

h1, h2 {
  margin: 0;
  font-size: clamp(26px, 8vmin, 44px);
  font-weight: 800;
  line-height: 1.2; /* Tay, Hint ve Bengal yazılarındaki işaretler kesilmesin */
  text-wrap: balance;
}

.lead {
  margin: 10px 0 0;
  font-size: clamp(15px, 4vmin, 20px);
  font-weight: 600;
  line-height: 1.35;
}

.best {
  margin: 10px 0 0;
  font-size: clamp(14px, 3.6vmin, 18px);
  font-weight: 700;
}

.result {
  margin: 8px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.result-num {
  font-size: clamp(44px, 16vmin, 84px);
  font-weight: 800;
  line-height: 1;
  color: var(--coral);
  -webkit-text-stroke: 3px var(--navy);
  paint-order: stroke fill;
  font-variant-numeric: tabular-nums;
}
.result-label {
  margin-top: 4px;
  font-size: clamp(14px, 3.6vmin, 18px);
  font-weight: 700;
}

.btn {
  margin-top: clamp(14px, 4vmin, 22px);
  min-width: min(100%, 220px);
  min-height: 56px;
  padding: 12px 28px;
  border: 4px solid var(--navy);
  border-radius: 999px;
  background: var(--yellow);
  box-shadow: 0 6px 0 var(--yellow-deep);
  color: var(--navy);
  font: inherit;
  font-size: clamp(20px, 5.5vmin, 28px);
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.btn:active {
  transform: translateY(4px) scale(0.97);
  box-shadow: 0 2px 0 var(--yellow-deep);
}
.btn:focus-visible {
  outline: 4px solid var(--navy);
  outline-offset: 4px;
}
.btn:disabled { cursor: default; }

@media (hover: hover) and (pointer: fine) {
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--yellow-deep); }
  .btn:hover:active { transform: translateY(4px) scale(0.97); box-shadow: 0 2px 0 var(--yellow-deep); }
}

/* Yükleniyor */
.dots { display: flex; gap: 12px; }
.dots span {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--coral);
  border: 3px solid var(--navy);
  animation: dot 900ms ease-in-out infinite;
}
.dots span:nth-child(2) { background: var(--yellow); animation-delay: 150ms; }
.dots span:nth-child(3) { background: var(--turq); animation-delay: 300ms; }
@keyframes dot {
  0%, 100% { transform: translateY(0); opacity: 0.6; }
  50% { transform: translateY(-10px); opacity: 1; }
}

/* Kısa ekranlar (yatay telefon, çok geniş oranlar) */
@media (max-height: 380px) {
  .panel { padding: 12px 20px; border-radius: 24px; }
  .lead { margin-top: 4px; }
  .best { margin-top: 4px; }
  .btn { margin-top: 10px; min-height: 48px; padding: 8px 24px; }
  .result { flex-direction: row; justify-content: center; align-items: baseline; gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .screen, .screen[data-open="true"] { transform: none; }
  .btn, .btn:active { transition: none; transform: none; }
  .dots span { animation: dotfade 900ms ease-in-out infinite; }
  @keyframes dotfade { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
}

.hud[data-bar="false"] .timebar { visibility: hidden; }

/* Oyun listesine dönüş (yalnızca açık sitede; Playables paketinde yok) */
.home {
  display: block;
  width: fit-content;
  margin: 14px auto 0;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--navy);
  font-size: clamp(15px, 3.8vmin, 18px);
  font-weight: 700;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.home:focus-visible { outline: 4px solid var(--navy); outline-offset: 2px; }
@media (max-height: 380px) { .home { margin-top: 4px; padding: 4px 12px; } }

</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<div class="hud" id="hud" data-open="false" aria-hidden="true">
  <div class="score"><span class="score-dot"></span><span id="hudScore">0</span></div>
  <div class="timebar"><div class="timebar-fill" id="timeFill"></div></div>
</div>

<div class="screen" id="loading" data-open="true" role="status">
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<div class="screen" id="menu" data-open="false" inert>
  <div class="panel">
    <h1 id="tTitle"></h1>
    <p class="lead" id="tLead"></p>
    <p class="best" id="menuBest" hidden></p>
    <button class="btn" id="btnPlay" type="button"></button>
    <a class="home" href="../">Tüm oyunlar</a>
  </div>
</div>

<div class="screen" id="over" data-open="false" inert>
  <div class="panel">
    <h2 id="tOver"></h2>
    <p class="result"><span class="result-num" id="overScore">0</span><span class="result-label" id="tScoreLabel"></span></p>
    <p class="best" id="overBest"></p>
    <button class="btn" id="btnAgain" type="button"></button>
    <a class="home" href="../">Tüm oyunlar</a>
  </div>
</div>

        good: function () { tone(660, 660, 0.09, 0, 0.18); tone(880, 880, 0.14, 0.08, 0.18); },
        bad: function () { tone(220, 160, 0.2, 0, 0.14, 'triangle'); },
        star: function () { tone(784, 784, 0.1, 0, 0.18); tone(1047, 1047, 0.1, 0.08, 0.18); tone(1319, 1319, 0.16, 0.16, 0.18); },
        end: function () { tone(523, 523, 0.14, 0, 0.18); tone(659, 659, 0.14, 0.14, 0.18); tone(784, 784, 0.28, 0.28, 0.18); }
      }
    };

    try {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      api.rm = mq.matches;
      mq.addEventListener('change', function (e) { api.rm = e.matches; });
    } catch (e) { /* eski tarayıcı */ }

    // ---------- Ses ----------
    var audioOn = true, actx = null;
    if (inYT) {
      try { audioOn = yt.system.isAudioEnabled(); } catch (e) { audioOn = false; }
      try { yt.system.onAudioEnabledChange(function (on) { audioOn = !!on; syncAudio(); }); } catch (e) { /* yok say */ }
    }
    function ensureAudio() {
      if (!audioOn || paused) return;
      try {
        if (!actx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          actx = new AC();
        }
        if (actx.state === 'suspended') actx.resume();
      } catch (e) { /* ses yok */ }
    }
    function syncAudio() {
      if (!actx) return;
      try { if (audioOn && !paused) actx.resume(); else actx.suspend(); } catch (e) { /* yok say */ }
    }
    function tone(freq, endFreq, dur, when, vol, type) {
      if (!audioOn || paused || !actx || actx.state !== 'running') return;
      var t0 = actx.currentTime + (when || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    }

    // ---------- Kayıt ----------
    var SAVE_KEY = 'pp-' + game.id;
    function parseSave(str) {
      try {
        var d = JSON.parse(str || '{}');
        var b = Math.floor(Number(d && d.best));
        return isFinite(b) && b > 0 ? b : 0;
      } catch (e) { return 0; }
    }
    function loadSave() {
      if (inYT) {
        return yt.game.loadData().then(function (str) {
          saveLoaded = true; best = Math.max(best, parseSave(str));
        }).catch(function () { saveLoaded = false; });
      }
      try { best = parseSave(window.localStorage.getItem(SAVE_KEY)); } catch (e) { /* yok say */ }
      saveLoaded = true;
      return Promise.resolve();
    }
    function writeSave() {
      if (!inYT) {
        try { window.localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, best: best })); } catch (e) { /* yok say */ }
        return;
      }
      // loadData başarıyla bitmeden saveData çağrılmaz: eski kaydın üzerine yazmamak için.
      var ready = saveLoaded ? Promise.resolve() : loadSave();
      ready.then(function () {
        if (!saveLoaded) return;
        return yt.game.saveData(JSON.stringify({ v: 1, best: best }));
      }).catch(warn);
    }
    function sendScore(value) {
      if (!inYT) return;
      try {
        var p = yt.engagement.sendScore({ value: value });
        if (p && p.catch) p.catch(warn);
      } catch (e) { warn(); }
    }
    function warn() { try { if (inYT) yt.health.logWarning(); } catch (e) { /* yok say */ } }
    window.addEventListener('error', function () { try { if (inYT) yt.health.logError(); } catch (e) { /* yok say */ } });

    // ---------- Çizim hazırlığı ----------
    function avatarSize() { return clamp(Math.min(api.W, api.H) * 0.13, 40, 92); }
    function avatarRow() { return showAvatars && api.H >= 340 ? avatarSize() + 26 : 10; }

    function resize() {
      api.W = Math.max(1, window.innerWidth);
      api.H = Math.max(1, window.innerHeight);
      api.dpr = clamp(window.devicePixelRatio || 1, 1, 3);
      canvas.width = Math.round(api.W * api.dpr);
      canvas.height = Math.round(api.H * api.dpr);
      api.R = clamp(Math.min(api.W, api.H) * 0.085, 30, 72);
      buildBackground();
      buildSprites();
      if (game.resize) game.resize(api);
      if (paused || api.state === 'loading') draw();
    }

    function buildBackground() {
      var W = api.W, H = api.H;
      bg.width = canvas.width; bg.height = canvas.height;
      var g = bg.getContext('2d');
      g.setTransform(api.dpr, 0, 0, api.dpr, 0, 0);
      var grad = g.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, sky[0]); grad.addColorStop(0.55, sky[1]); grad.addColorStop(0.85, sky[2]);
      g.fillStyle = grad; g.fillRect(0, 0, W, H);

      var cx = W / 2, cy = H * 0.9, rr = Math.min(W * 0.62, H * 0.78), band = Math.max(2, rr * 0.055);
      var arcs = ['#FF8A80', '#FFB974', '#FFE27A', '#9BE3A8', '#8FD3F4', '#C3A6F0'];
      g.globalAlpha = 0.42; g.lineWidth = band;
      for (var i = 0; i < arcs.length; i++) {
        g.strokeStyle = arcs[i];
        g.beginPath(); g.arc(cx, cy, Math.max(1, rr - i * band), Math.PI, TAU); g.stroke();
      }
      g.globalAlpha = 1;

      var u = clamp(Math.min(W, H) * 0.12, 36, 110);
      cloud(g, W * 0.12, H * 0.16, u); cloud(g, W * 0.86, H * 0.12, u * 1.15);
      cloud(g, W * 0.7, H * 0.42, u * 0.7); cloud(g, W * 0.2, H * 0.5, u * 0.6);

      g.fillStyle = '#BFE3A8';
      g.beginPath(); g.ellipse(W * 0.2, H * 1.08, W * 0.6, H * 0.2, 0, 0, TAU); g.fill();
      g.fillStyle = '#A9D992';
      g.beginPath(); g.ellipse(W * 0.85, H * 1.1, W * 0.6, H * 0.2, 0, 0, TAU); g.fill();
    }
    function cloud(g, x, y, s) {
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath();
      g.arc(x - s * 0.55, y + s * 0.1, s * 0.38, 0, TAU);
      g.arc(x, y - s * 0.12, s * 0.5, 0, TAU);
      g.arc(x + s * 0.55, y + s * 0.08, s * 0.4, 0, TAU);
      g.rect(x - s * 0.55, y + s * 0.05, s * 1.1, s * 0.43);
      g.fill();
    }

    // Toplar büyük çizilir, küçükleri aynı görüntüden küçültülür (her boyutta net kalır).
    function buildSprites() {
      sprites = {};
      var r = clamp(Math.min(api.W, api.H) * 0.22, 60, 190);
      var all = COLORS.concat([STAR]);
      for (var i = 0; i < all.length; i++) sprites[all[i].id] = makeBall(all[i], r, all[i] === STAR);
    }
    function makeBall(c, r, star) {
      var pad = Math.ceil(r * 0.06) + 2;
      var size = Math.ceil((r + pad) * 2 * api.dpr);
      var cv = document.createElement('canvas');
      cv.width = cv.height = size;
      var g = cv.getContext('2d');
      g.setTransform(api.dpr, 0, 0, api.dpr, 0, 0);
      g.translate(r + pad, r + pad);
      var grad = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      grad.addColorStop(0, c.light); grad.addColorStop(0.6, c.base); grad.addColorStop(1, c.dark);
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fillStyle = grad; g.fill();
      g.save(); g.clip();
      g.lineWidth = Math.max(1.5, r * 0.06); g.lineCap = 'round';
      var bundles = [[0.5, c.dark], [-0.75, c.light], [1.9, c.dark]];
      for (var b = 0; b < bundles.length; b++) {
        g.save(); g.rotate(bundles[b][0]); g.strokeStyle = bundles[b][1]; g.globalAlpha = 0.6;
        for (var i = -3; i <= 3; i++) {
          g.beginPath(); g.ellipse(0, i * r * 0.17, r * 1.05, r * 0.4, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
        }
        g.restore();
      }
      g.restore();
      g.beginPath(); g.arc(0, 0, r, 0, TAU);
      g.lineWidth = Math.max(2, r * 0.07); g.strokeStyle = c.line; g.stroke();
      if (star) {
        g.beginPath();
        for (var k = 0; k < 10; k++) {
          var rad = k % 2 === 0 ? r * 0.5 : r * 0.22, a = -Math.PI / 2 + k * Math.PI / 5;
          g.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        g.closePath();
        g.fillStyle = '#FFFFFF'; g.fill();
        g.lineJoin = 'round'; g.lineWidth = Math.max(2, r * 0.06); g.strokeStyle = c.line; g.stroke();
      }
      return { cv: cv, k: (r + pad) / r };
    }

    function loadImages() {
      var srcs = window.PP_IMG || [];
      return Promise.all(srcs.map(function (src, i) {
        return new Promise(function (done) {
          var im = new Image();
          im.onload = function () { images[i] = im; done(); };
          im.onerror = function () { done(); };
          im.src = src;
        });
      }));
    }

    function drawAvatar(i, x, y, size) {
      var ring = Math.max(3, size * 0.05);
      ctx.beginPath(); ctx.arc(x, y, size / 2 + ring, 0, TAU); ctx.fillStyle = '#1E2A78'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, size / 2, 0, TAU); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      if (images[i]) {
        ctx.save(); ctx.clip();
        ctx.drawImage(images[i], x - size / 2, y - size / 2, size, size);
        ctx.restore();
      }
    }
    function drawAvatarRow() {
      if (!showAvatars || api.H < 340) return;
      if (api.state !== 'playing' && api.H < 460) return; // kısa ekranda menü paneliyle çakışmasın
      var size = avatarSize(), gap = size * 0.28;
      var x0 = (api.W - (size * 3 + gap * 2)) / 2 + size / 2, y0 = api.H - size / 2 - 14;
      for (var i = 0; i < 3; i++) drawAvatar(i, x0 + i * (size + gap), y0 + Math.min(0, avatars[i].y) * size, size);
    }

    // ---------- Akış ----------
    function show(name) {
      for (var key in screens) {
        var open = key === name;
        screens[key].setAttribute('data-open', open ? 'true' : 'false');
        if (open) screens[key].removeAttribute('inert'); else screens[key].setAttribute('inert', '');
      }
    }

    function begin() {
      ensureAudio();
      api.setScore(0);
      api.timeLeft = game.round || 0; api.progress = 0;
      bits.length = 0; floats.length = 0;
      api.state = 'playing';
      show(null);
      hud.setAttribute('data-bar', game.round ? 'true' : 'false');
      hud.setAttribute('data-open', 'true');
      game.begin(api);
    }

    function finish() {
      if (api.state !== 'playing') return;
      api.state = 'over';
      hud.setAttribute('data-open', 'false');
      var isBest = api.score > best;
      if (isBest) best = api.score;
      el('tOver').textContent = game.round ? T.over : T.overTitle;
      el('overScore').textContent = String(api.score);
      el('overBest').textContent = isBest ? T.newBest : best > 0 ? T.best.replace('{n}', best) : '';
      api.sfx.end();
      sendScore(api.score);
      if (isBest) writeSave();
      // Hızlı dokunan çocuk yanlışlıkla yeniden başlatmasın diye düğme kısa süre kapalı.
      btnAgain.disabled = true;
      show('over');
      window.setTimeout(function () {
        btnAgain.disabled = false;
        if (api.state === 'over') btnAgain.focus({ preventScroll: true });
      }, 700);
    }

    function update(dt) {
      api.clock += dt;
      var i;
      if (api.state === 'playing') {
        if (game.round) {
          api.timeLeft -= dt;
          api.progress = 1 - Math.max(0, api.timeLeft) / game.round;
        }
        game.update(dt, api);
        if (game.round && api.timeLeft <= 0 && api.state === 'playing') { api.timeLeft = 0; finish(); }
      } else if (api.state !== 'loading') {
        // Menü ve bitiş ekranında arkada süzülen toplar.
        ambientIn -= dt;
        if (ambientIn <= 0 && ambient.length < 10) {
          ambient.push({ c: api.pick(COLORS), x: api.rand(0.06, 0.94), y: 1.15, s: api.rand(0.8, 1.15), v: api.rand(0.1, 0.16), ph: api.rand(0, TAU) });
          ambientIn = 1.2;
        }
      }
      for (i = ambient.length - 1; i >= 0; i--) {
        ambient[i].y -= ambient[i].v * dt;
        if (ambient[i].y < -0.2 || api.state === 'playing') ambient.splice(i, 1);
      }
      for (i = bits.length - 1; i >= 0; i--) {
        var p = bits[i];
        p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.t > 0.45) bits.splice(i, 1);
      }
      for (i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 0.6) floats.splice(i, 1); }
      for (i = 0; i < 3; i++) {
        var a = avatars[i];
        a.v += (-260 * a.y - 14 * a.v) * dt; a.y += a.v * dt;
      }
    }

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(bg, 0, 0);
      ctx.setTransform(api.dpr, 0, 0, api.dpr, 0, 0);
      var i;
      for (i = 0; i < ambient.length; i++) {
        var b = ambient[i];
        var sway = api.rm ? 0 : Math.sin(api.clock * 1.1 + b.ph) * 0.02;
        api.ball(b.c, (b.x + sway) * api.W, b.y * api.H, api.R * b.s);
      }
      if (api.state === 'playing') game.draw(ctx, api);

      ctx.lineCap = 'round';
      for (i = 0; i < bits.length; i++) {
        var q = bits[i], sp = Math.sqrt(q.vx * q.vx + q.vy * q.vy) || 1;
        ctx.globalAlpha = 1 - q.t / 0.45;
        ctx.strokeStyle = q.c; ctx.lineWidth = Math.max(3, api.R * 0.1);
        ctx.beginPath(); ctx.moveTo(q.x, q.y);
        ctx.lineTo(q.x - (q.vx / sp) * q.len, q.y - (q.vy / sp) * q.len); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      drawAvatarRow();

      for (i = 0; i < floats.length; i++) {
        var f = floats[i], t = f.t / 0.6;
        var rise = api.rm ? 0 : (1 - Math.pow(1 - t, 3)) * api.R * 0.9;
        ctx.globalAlpha = t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4;
        api.label(f.text, f.x, f.y - rise, api.R * 0.7);
      }
      ctx.globalAlpha = 1;
    }

    function frame(ts) {
      rafId = 0;
      if (paused) return;
      var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
      lastTs = ts;
      update(dt);
      draw();
      if (api.state === 'playing' && game.round) {
        timeFill.style.transform = 'scaleX(' + (1 - api.progress).toFixed(4) + ')';
        var low = api.timeLeft <= 5 ? 'true' : 'false';
        if (timeFill.getAttribute('data-low') !== low) timeFill.setAttribute('data-low', low);
      }
      rafId = window.requestAnimationFrame(frame);
    }
    function run() { if (!rafId && !paused) { lastTs = 0; rafId = window.requestAnimationFrame(frame); } }
    function pause() {
      paused = true;
      if (rafId) { window.cancelAnimationFrame(rafId); rafId = 0; }
      syncAudio();
    }
    function resume() { paused = false; syncAudio(); run(); }
    if (inYT) { try { yt.system.onPause(pause); yt.system.onResume(resume); } catch (e) { /* yok say */ } }

    // ---------- Girdi ----------
    function pointer(type) {
      return function (e) {
        if (paused || api.state !== 'playing' || !game.pointer) return;
        if (type === 'down') ensureAudio();
        var rect = canvas.getBoundingClientRect();
        game.pointer(type, e.clientX - rect.left, e.clientY - rect.top, api);
      };
    }
    canvas.addEventListener('pointerdown', pointer('down'));
    canvas.addEventListener('pointermove', pointer('move'));
    canvas.addEventListener('pointerup', pointer('up'));
    window.addEventListener('keydown', function (e) {
      if (paused || api.state !== 'playing' || !game.key) return;
      game.key(e.key, true, api);
    });
    window.addEventListener('keyup', function (e) {
      if (paused || api.state !== 'playing' || !game.key) return;
      game.key(e.key, false, api);
    });

    // ---------- Başlangıç ----------
    function pickLanguage() {
      if (!inYT) {
        // Açık sitede ?lang=xx ile dil seçilebilir; Playables içinde yalnızca YouTube'un dili kullanılır.
        var forced = null;
        try { forced = new URLSearchParams(window.location.search).get('lang'); } catch (e) { /* yok say */ }
        return Promise.resolve(forced || navigator.language || 'en');
      }
      try { return yt.system.getLanguage().catch(function () { return 'en'; }); } catch (e) { return Promise.resolve('en'); }
    }
    // Dil etiketini ("pt-BR", "zh-Hans-CN") elimizdeki 20 dilden birine eşler; yoksa İngilizce.
    function pickLang(tag) {
      var all = window.PP_TEXT || {};
      var base = String(tag || 'en').toLowerCase().split(/[-_]/)[0];
      if (base === 'in') base = 'id';
      return all[base] ? base : 'en';
    }
    function applyText(tag) {
      var lang = pickLang(tag);
      T = (window.PP_TEXT || {})[lang] || {};
      document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.title = T.title;
      el('tTitle').textContent = T.title;
      el('tLead').textContent = T.lead;
      el('tOver').textContent = T.over;
      el('tScoreLabel').textContent = T.score;
      btnPlay.textContent = T.play;
      btnAgain.textContent = T.again;
      var homes = document.querySelectorAll('.home');
      for (var i = 0; i < homes.length; i++) homes[i].textContent = T.home;
      var mb = el('menuBest');
      if (best > 0) { mb.textContent = T.best.replace('{n}', best); mb.hidden = false; } else { mb.hidden = true; }
    }

    window.addEventListener('resize', resize);
    btnPlay.addEventListener('click', begin);
    btnAgain.addEventListener('click', begin);

    resize();
    draw();
    window.requestAnimationFrame(function () {
      // Yükleme ekranı çizildi.
      try { if (yt) yt.game.firstFrameReady(); } catch (e) { /* yok say */ }
      Promise.all([loadImages(), loadSave(), pickLanguage()]).then(function (res) {
        applyText(res[2]);
        api.state = 'menu';
        show('menu');
        run();
        // Menü etkileşime açık.
        try { if (yt) yt.game.gameReady(); } catch (e) { /* yok say */ }
      });
    });
  }

  return { start: start };
})();

// Ponpon Patlat: yukarı süzülen yün toplarına dokun, patlat.
PP.start({
  id: 'ponpon-patlat',
  round: 45,

  begin: function (a) {
    this.balls = [];
    this.pops = [];
    this.spawnIn = 0.2;
  },

  x: function (b, a) {
    var sway = a.rm ? 0 : Math.sin(a.clock * b.fr + b.ph) * 0.02;
    return (b.x + sway) * a.W;
  },

  update: function (dt, a) {
    var i;
    this.spawnIn -= dt;
    if (this.spawnIn <= 0 && this.balls.length < 28) {
      var star = Math.random() < 0.1;
      this.balls.push({
        c: star ? a.STAR : a.pick(a.COLORS),
        x: a.rand(0.08, 0.92), y: 1 + (a.R * 1.3) / a.H,
        s: star ? 1.1 : a.rand(0.82, 1.12),
        v: a.lerp(0.2, 0.38, a.progress) * a.rand(0.85, 1.15),
        ph: a.rand(0, a.TAU), fr: a.rand(0.8, 1.6)
      });
      this.spawnIn = a.lerp(0.85, 0.36, a.progress);
    }
    for (i = this.balls.length - 1; i >= 0; i--) {
      this.balls[i].y -= this.balls[i].v * dt;
      if (this.balls[i].y * a.H < -a.R * 1.5) this.balls.splice(i, 1);
    }
    for (i = this.pops.length - 1; i >= 0; i--) {
      this.pops[i].t += dt;
      if (this.pops[i].t > 0.16) this.pops.splice(i, 1);
    }
  },

  draw: function (ctx, a) {
    var i;
    for (i = 0; i < this.balls.length; i++) {
      var b = this.balls[i];
      a.ball(b.c, this.x(b, a), b.y * a.H, a.R * b.s);
    }
    for (i = 0; i < this.pops.length; i++) {
      var p = this.pops[i], e = 1 - Math.pow(1 - p.t / 0.16, 3);
      a.ball(p.c, p.x, p.y, p.r * (a.rm ? 1 : 1 + 0.3 * e), 1 - e);
    }
  },

  pointer: function (type, x, y, a) {
    if (type !== 'down') return;
    for (var i = this.balls.length - 1; i >= 0; i--) {
      var b = this.balls[i], bx = this.x(b, a), by = b.y * a.H, r = a.R * b.s;
      var dx = bx - x, dy = by - y, hit = r * 1.25; // küçük parmaklar için geniş dokunma alanı
      if (dx * dx + dy * dy > hit * hit) continue;
      this.balls.splice(i, 1);
      this.pops.push({ c: b.c, x: bx, y: by, r: r, t: 0 });
      var gain = b.c === a.STAR ? 5 : 1;
      a.addScore(gain);
      a.burst(bx, by, b.c, gain > 1 ? 12 : 8, r);
      a.float(bx, by - r, '+' + gain);
      if (gain > 1) a.sfx.star(); else a.sfx.pop(a.COLORS.indexOf(b.c));
      a.cheer(b.c.who);
      return;
    }
  }
});
